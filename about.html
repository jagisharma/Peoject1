    <style>
      :root { color-scheme: dark; --ink:#f7f7ff; --muted:#c8c7dc; --violet:#9a75ff; --aqua:#5ce1e6; }
      * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#0d0d1d; }
      .glow { position:fixed; width:42rem; aspect-ratio:1; border-radius:50%; filter:blur(90px); opacity:.38; pointer-events:none; }
      .one { background:var(--violet); top:-20rem; left:-14rem; } .two { background:var(--aqua); bottom:-23rem; right:-13rem; }
      main { width:min(90%,720px); padding:clamp(2rem,7vw,4.75rem); text-align:center; background:rgba(24,23,52,.68); border:1px solid rgba(255,255,255,.16); border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); animation:enter .8s cubic-bezier(.2,.8,.2,1) both; }
      nav { display:flex; justify-content:center; gap:.35rem; margin:0 auto 3rem; } nav a { padding:.55rem .85rem; color:var(--muted); border-radius:999px; text-decoration:none; font-size:.9rem; transition:background .2s,color .2s; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.1); color:var(--ink); }
      .eyebrow { margin:0 0 1.25rem; color:var(--aqua); font-size:.78rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(3rem,9vw,5.5rem); line-height:.95; letter-spacing:-.075em; background:linear-gradient(120deg,#fff 25%,#b8a5ff 58%,#75f1ef); -webkit-background-clip:text; background-clip:text; color:transparent; } p { max-width:36rem; margin:1.7rem auto 0; color:var(--muted); font-size:clamp(1rem,2.4vw,1.15rem); line-height:1.7; } .line { width:3.5rem; height:2px; margin:2rem auto 0; background:linear-gradient(90deg,var(--violet),var(--aqua)); border-radius:10px; } @keyframes enter { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    </style>
  </head>
