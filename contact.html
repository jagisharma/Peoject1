<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch." />
    <title>Contact | Hello, World!</title>
    <style>
      :root { color-scheme:dark; --ink:#f7f7ff; --muted:#c8c7dc; --violet:#9a75ff; --aqua:#5ce1e6; } * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#0d0d1d; } .glow { position:fixed; width:42rem; aspect-ratio:1; border-radius:50%; filter:blur(90px); opacity:.38; pointer-events:none; } .one { background:var(--violet); top:-20rem; left:-14rem; } .two { background:var(--aqua); bottom:-23rem; right:-13rem; } main { width:min(90%,720px); padding:clamp(2rem,7vw,4.75rem); text-align:center; background:rgba(24,23,52,.68); border:1px solid rgba(255,255,255,.16); border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); animation:enter .8s cubic-bezier(.2,.8,.2,1) both; } nav { display:flex; justify-content:center; gap:.35rem; margin:0 auto 3rem; } nav a { padding:.55rem .85rem; color:var(--muted); border-radius:999px; text-decoration:none; font-size:.9rem; transition:background .2s,color .2s; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.1); color:var(--ink); } .eyebrow { margin:0 0 1.25rem; color:var(--aqua); font-size:.78rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(3rem,9vw,5.5rem); line-height:.95; letter-spacing:-.075em; background:linear-gradient(120deg,#fff 25%,#b8a5ff 58%,#75f1ef); -webkit-background-clip:text; background-clip: text; color:transparent; } p { max-width:34rem; margin:1.7rem auto 0; color:var(--muted); font-size:clamp(1rem,2.4vw,1.15rem); line-height:1.7; } .button { display:inline-block; margin-top:2rem; padding:.85rem 1.3rem; border-radius:999px; color:#151428; background:linear-gradient(110deg,#b8a5ff,#75f1ef); font-weight:750; text-decoration:none; transition:transform .2s,box-shadow .2s; } .button:hover { transform:translateY(-2px); box-shadow:0 12px 24px rgba(92,225,230,.2); } @keyframes enter { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    </style>
  </head>
  <body>
    <div class="glow one"></div><div class="glow two"></div>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a href="contact.html" aria-current="page">Contact</a></nav>
      <p class="eyebrow">Let’s have a conversation.</p>
      <h1>Say hello.</h1>
      <p>Have an idea, a question, or simply want to start a conversation? We would love to hear from you.</p>
      <a class="button" href="mailto:hello@example.com">Email us</a>
    </main>
  </body>
</html>
