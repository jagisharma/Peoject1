<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A collection of bright ideas." />
    <title>Gallery | Hello, World!</title>
    <style>
      :root { color-scheme:dark; --ink:#f7f7ff; --muted:#c8c7dc; --violet:#9a75ff; --aqua:#5ce1e6; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; padding:3rem 0; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:#0d0d1d; }
      .glow { position:fixed; width:42rem; aspect-ratio:1; border-radius:50%; filter:blur(90px); opacity:.32; pointer-events:none; z-index:-1; }
      .one { background:var(--violet); top:-20rem; left:-14rem; } .two { background:var(--aqua); bottom:-23rem; right:-13rem; }
      main { width:min(90%,960px); margin:auto; padding:clamp(2rem,6vw,4rem); text-align:center; background:rgba(24,23,52,.68); border:1px solid rgba(255,255,255,.16); border-radius:28px; box-shadow:0 30px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); animation:enter .8s cubic-bezier(.2,.8,.2,1) both; }
      nav { display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem; margin:0 auto 3rem; } nav a { padding:.55rem .85rem; color:var(--muted); border-radius:999px; text-decoration:none; font-size:.9rem; transition:background .2s,color .2s; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.1); color:var(--ink); }
      .eyebrow { margin:0 0 1.15rem; color:var(--aqua); font-size:.78rem; font-weight:750; letter-spacing:.18em; text-transform:uppercase; }
      h1 { margin:0; font-size:clamp(3rem,9vw,5.5rem); line-height:.95; letter-spacing:-.075em; background:linear-gradient(120deg,#fff 25%,#b8a5ff 58%,#75f1ef); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .intro { max-width:34rem; margin:1.35rem auto 2.4rem; color:var(--muted); line-height:1.7; }
      .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; text-align:left; }
      .tile { min-height:180px; padding:1.25rem; display:flex; align-items:end; border:1px solid rgba(255,255,255,.12); border-radius:18px; overflow:hidden; color:white; font-weight:750; letter-spacing:.02em; text-shadow:0 2px 8px rgba(0,0,0,.3); transition:transform .25s ease, border-color .25s ease; }
      .tile:hover { transform:translateY(-5px); border-color:rgba(255,255,255,.36); }
      .tile:nth-child(1) { background:radial-gradient(circle at 25% 25%,#f8c1ff,transparent 35%),linear-gradient(145deg,#8a59ed,#313a92); }
      .tile:nth-child(2) { background:radial-gradient(circle at 70% 25%,#c3fff5,transparent 32%),linear-gradient(145deg,#0e9ea6,#183558); }
      .tile:nth-child(3) { background:radial-gradient(circle at 50% 75%,#ffd894,transparent 35%),linear-gradient(145deg,#d45d83,#5b246b); }
      .tile:nth-child(4) { background:radial-gradient(circle at 30% 30%,#d1dbff,transparent 30%),linear-gradient(145deg,#4556b9,#162743); }
      .tile:nth-child(5) { background:radial-gradient(circle at 75% 65%,#e3ffaf,transparent 33%),linear-gradient(145deg,#3f9a73,#24405e); }
      .tile:nth-child(6) { background:radial-gradient(circle at 30% 65%,#ffbce1,transparent 30%),linear-gradient(145deg,#c14082,#30245e); }
      @media (max-width:650px) { .grid { grid-template-columns:repeat(2,1fr); } .tile { min-height:145px; } }
      @keyframes enter { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    </style>
  </head>
  <body>
    <div class="glow one"></div><div class="glow two"></div>
    <main>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav>
      <p class="eyebrow">A collection of ideas</p>
      <h1>Gallery.</h1>
      <p class="intro">A colorful collection of moments, moods, and sparks of inspiration.</p>
      <section class="grid" aria-label="Gallery collection">
        <article class="tile">Dream in color</article><article class="tile">Fresh perspective</article><article class="tile">Golden hour</article><article class="tile">Deep blue</article><article class="tile">Growing ideas</article><article class="tile">Make it memorable</article>
      </section>
    </main>
  </body>
</html>
