<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished Hello World page." />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f7ff;
        --muted: #c8c7dc;
        --violet: #9a75ff;
        --aqua: #5ce1e6;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d0d1d;
      }

      .glow {
        position: fixed;
        width: 42rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(90px);
        opacity: .38;
        pointer-events: none;
      }

      .glow-one { background: var(--violet); top: -20rem; left: -14rem; }
      .glow-two { background: var(--aqua); bottom: -23rem; right: -13rem; }

      main {
        width: min(90%, 720px);
        padding: clamp(2rem, 7vw, 4.75rem);
        text-align: center;
        background: rgba(24, 23, 52, .68);
        border: 1px solid rgba(255, 255, 255, .16);
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
        backdrop-filter: blur(18px);
        animation: enter .8s cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: var(--aqua);
        font-size: .78rem;
        font-weight: 750;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.5rem);
        line-height: .95;
        letter-spacing: -.075em;
        background: linear-gradient(120deg, #fff 25%, #b8a5ff 58%, #75f1ef);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 37rem;
        margin: 1.7rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.4vw, 1.2rem);
        line-height: 1.7;
      }

      .badge {
        display: inline-flex;
        gap: .55rem;
        align-items: center;
        margin-top: 2rem;
        padding: .7rem 1rem;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 999px;
        background: rgba(255,255,255,.07);
        font-size: .9rem;
      }

      .dot {
        width: .55rem;
        height: .55rem;
        border-radius: 50%;
        background: #8cf5b6;
        box-shadow: 0 0 14px #8cf5b6;
      }

      @keyframes enter {
        from { opacity: 0; transform: translateY(18px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
    <main>
      <p class="eyebrow">A warm welcome</p>
      <h1>Hello, World!</h1>
      <p>A little corner of the web, made with care. This is the beginning of something wonderful.</p>
      <div class="badge"><span class="dot"></span> Ready to build</div>
    </main>
  </body>
</html>
